<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiyan Telecom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h1 {
            color: #0d6efd;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: block;
            padding: 12px;
            background-color: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #0b5ed7;
        }
        .btn-secondary {
            background-color: #198754;
        }
        .btn-secondary:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>রায়হান টেলিকম</h1>
        <p>আমাদের সকল টেলিকম সেবা ও অফারসমূহ সহজে পেতে নিচে থাকা বাটনগুলোতে ক্লিক করুন।</p>
        
        <div class="btn-group">
            <a href="#" class="btn">রিচার্জ সেবা</a>
            <a href="#" class="btn btn-secondary">ড্রাইভ প্যাক ও অফার</a>
        </div>
    </div>

</body>
</html>
