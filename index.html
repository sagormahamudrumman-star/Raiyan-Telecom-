<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raiyan Telecom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #f2f4f3; padding-bottom: 30px; }
  .header { background: #1a8f4c; color: #fff; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: .9; margin-top: 4px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card span { font-size: 12px; color: #666; }
  .card b { display: block; font-size: 20px; color: #1a8f4c; margin-top: 6px; }
  .section { padding: 0 15px; margin-top: 10px; }
  .section h2 { font-size: 16px; margin-bottom: 10px; color: #222; }
  .form-box { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .form-box input, .form-box select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .form-box button { width: 100%; padding: 12px; background: #1a8f4c; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; }
  .record-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .record-card img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #eee; }
  .record-card .info { font-size: 13px; line-height: 1.6; }
  .record-card .del { margin-left: auto; background: #e33; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>📞 Raiyan Telecom</h1>
  <p>আপনার ব্যবসা, আপনার নিয়ন্ত্রণ</p>
</div>

<div class="cards">
  <div class="card"><span>মোট বিক্রি</span><b id="totalSales">৳0</b></div>
  <div class="card"><span>মোট খরচ</span><b id="totalExpense">৳0</b></div>
  <div class="card"><span>মোট লাভ</span><b id="totalProfit">৳0</b></div>
  <div class="card"><span>মোট বাকি</span><b id="totalDue">৳0</b></div>
</div>

<div class="section">
  <h2>⚡ নতুন হিসাব যোগ করুন</h2>
  <div class="form-box">
    <select id="type">
      <option value="বিক্রি">বিক্রি</option>
      <option value="রিচার্জ">রিচার্জ</option>
      <option value="খরচ">খরচ</option>
      <option value="বাকি">বাকি</option>
    </select>
    <input type="text" id="productName" placeholder="পণ্যের / কাস্টমারের নাম">
    <input type="file" id="productImage" accept="image/*">
    <input type="number" id="costPrice" placeholder="ক্রয়মূল্য" oninput="calcProfit()">
    <input type="number" id="salePrice" placeholder="বিক্রয়মূল্য" oninput="calcProfit()">
    <input type="number" id="profit" placeholder="লাভ (স্বয়ংক্রিয়)" readonly>
    <input type="number" id="quantity" placeholder="পরিমাণ" value="1">
    <button onclick="saveRecord()">যোগ করুন</button>
  </div>
</div>

<div class="section">
  <h2>📋 হিসাবের তালিকা</h2>
  <div id="recordList"></div>
</div>

<script>
let imageData = "";

document.getElementById('productImage').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const scale = Math.min(300 / img.width, 300 / img.height, 1);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      imageData = canvas.toDataURL('image/jpeg', 0.7);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function calcProfit() {
  const cost = parseFloat(document.getElementById('costPrice').value) || 0;
  const sale = parseFloat(document.getElementById('salePrice').value) || 0;
  document.getElementById('profit').value = sale - cost;
}

function saveRecord() {
  const name = document.getElementById('productName').value.trim();
  if (!name) { alert('নাম লিখুন'); return; }

  const record = {
    type: document.getElementById('type').value,
    image: imageData,
    name: name,
    cost: parseFloat(document.getElementById('costPrice').value) || 0,
    sale: parseFloat(document.getElementById('salePrice').value) || 0,
    profit: parseFloat(document.getElementById('profit').value) || 0,
    qty: parseInt(document.getElementById('quantity').value) || 1,
    date: new Date().toLocaleDateString('bn-BD')
  };

  let records = JSON.parse(localStorage.getItem('records') || '[]');
  records.push(record);
  localStorage.setItem('records', JSON.stringify(records));

  imageData = "";
  document.querySelectorAll('.form-box input').forEach(i => i.value = i.id === 'quantity' ? 1 : '');
  render();
}

function deleteRecord(index) {
  let records = JSON.parse(localStorage.getItem('records') || '[]');
  records.splice(index, 1);
  localStorage.setItem('records', JSON.stringify(records));
  render();
}

function render() {
  const records = JSON.parse(localStorage.getItem('records') || '[]');
  const container = document.getElementById('recordList');
  container.innerHTML = "";

  let sales = 0, cost = 0, profit = 0, due = 0;

  records.forEach((r, i) => {
    if (r.type === 'বিক্রি') { sales += r.sale * r.qty; cost += r.cost * r.qty; profit += r.profit * r.qty; }
    if (r.type === 'খরচ') { cost += r.sale * r.qty; }
    if (r.type === 'বাকি') { due += r.sale * r.qty; }
    if (r.type === 'রিচার্জ') { sales += r.sale * r.qty; profit += r.profit * r.qty; }

    container.innerHTML += `
      <div class="record-card">
        <img src="${r.image || ''}" alt="">
        <div class="info">
          <strong>${r.name}</strong> <small>(${r.type})</small><br>
          ক্রয়: ৳${r.cost} | বিক্রয়: ৳${r.sale}<br>
          লাভ: ৳${r.profit} | পরিমাণ: ${r.qty}<br>
          <small>${r.date}</small>
        </div>
        <button class="del" onclick="deleteRecord(${i})">🗑</button>
      </div>`;
  });

  document.getElementById('totalSales').innerText = '৳' + sales;
  document.getElementById('totalExpense').innerText = '৳' + cost;
  document.getElementById('totalProfit').innerText = '৳' + profit;
  document.getElementById('totalDue').innerText = '৳' + due;
}

render();
</script>
</body>
</html>
